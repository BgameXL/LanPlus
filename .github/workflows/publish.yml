name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Normalize version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to gradle.properties
        run: sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/" gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/
          retention-days: 7

      - name: Attach jars to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "fabric/build/libs/LanPlus-fabric-${{ steps.version.outputs.version }}.jar" \
            "forge/build/libs/LanPlus-forge-${{ steps.version.outputs.version }}.jar" \
            --clobber

  publish-fabric:
    name: Publish Fabric
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: ${{ github.event.release.name || format('LAN+ {0}', needs.build.outputs.version) }} (Fabric)
          changelog: ${{ github.event.release.body }}

          files: fabric/build/libs/LanPlus-fabric-${{ needs.build.outputs.version }}.jar
          loaders: fabric
          version: ${{ needs.build.outputs.version }}-fabric
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          game-versions: '1.20.1'
          game-version-filter: none
          java: '17'

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

  publish-forge:
    name: Publish Forge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: ${{ github.event.release.name || format('LAN+ {0}', needs.build.outputs.version) }} (Forge)
          changelog: ${{ github.event.release.body }}

          files: forge/build/libs/LanPlus-forge-${{ needs.build.outputs.version }}.jar
          loaders: forge
          version: ${{ needs.build.outputs.version }}-forge
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          game-versions: '1.20.1'
          game-version-filter: none
          java: '17'

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail