name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Normalize version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to gradle.properties
        run: sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/" gradle.properties

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Extract changelog from annotated tag
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            BODY=$(git tag -l --format='%(contents)' "$TAG")
          else
            echo "::warning::$TAG no es un tag anotado; las notas quedarán vacías. Crea el tag con 'git tag -a'."
            BODY=""
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge, Modrinth & GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          changelog: ${{ steps.changelog.outputs.body }}

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            forge/build/libs/!(*-@(dev|sources|javadoc)).jar

          name: LAN+ ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: |
            fabric
            forge
          game-versions: '1.20.1'
          java: '17'

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: warn